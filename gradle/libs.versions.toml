# Alla versioner på ett ställe – i takt med ReseApoteket och Dagboken (samma värden som deras
# gradle/libs.versions.toml). Höj här i samma takt som apparna, annars får appen två versioner
# av Compose/Material 3 på klassvägen.

[versions]
agp                      = "9.5.2"
kotlin                   = "2.4.21"
composeBom               = "2026.11.01"
material3                = "1.5.0"
kotlinxCoroutines        = "1.11.0"
kotlinxCollections       = "0.5.2"
kotlinxDatetime          = "0.8.0"
kotlinxSerialization     = "1.13.0"  # flikarnas sparade back stack i ui-navigation
navigation3              = "1.2.2"   # ui-navigation – samma som apparna
androidxAnnotation       = "1.11.0"   # samma som Compose BOM drar in
activityCompose          = "1.13.0"  # BackHandler i EntityEditScreen
lifecycle                = "2.11.1"  # collectAsStateWithLifecycle i ArchiveActions, ViewModel per skärm i ui-navigation
junit                    = "4.13.2"
robolectric              = "4.18.1"
roborazzi                = "1.79.0"
konsist                  = "0.18.1"
turbine                  = "1.2.1"
coil                     = "3.6.3"   # profilfotot i AccountAvatar, cachat på disk – samma som Dagboken
concurrentFutures        = "1.3.0"
errorProneAnnotations    = "2.53.0"
pmd                      = "7.29.0"
spotless                 = "8.11.0"
ktlint                   = "1.8.0"
composeRules             = "0.6.8"

[libraries]
androidx-compose-bom                  = { group = "androidx.compose",            name = "compose-bom",                       version.ref = "composeBom" }
androidx-compose-ui                   = { group = "androidx.compose.ui",         name = "ui" }
androidx-compose-ui-graphics          = { group = "androidx.compose.ui",         name = "ui-graphics" }
androidx-compose-ui-test-junit4       = { group = "androidx.compose.ui",         name = "ui-test-junit4" }
androidx-compose-ui-test-manifest     = { group = "androidx.compose.ui",         name = "ui-test-manifest" }
androidx-compose-material3            = { group = "androidx.compose.material3",  name = "material3",                         version.ref = "material3" }
androidx-compose-runtime              = { group = "androidx.compose.runtime",    name = "runtime" }
androidx-activity-compose             = { group = "androidx.activity",           name = "activity-compose",                  version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose    = { group = "androidx.lifecycle",          name = "lifecycle-runtime-compose",         version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle",    name = "lifecycle-viewmodel-navigation3",   version.ref = "lifecycle" }
androidx-navigation3-runtime          = { group = "androidx.navigation3",        name = "navigation3-runtime",               version.ref = "navigation3" }
androidx-navigation3-ui               = { group = "androidx.navigation3",        name = "navigation3-ui",                    version.ref = "navigation3" }
kotlinx-serialization-json            = { group = "org.jetbrains.kotlinx",       name = "kotlinx-serialization-json",        version.ref = "kotlinxSerialization" }
androidx-annotation                   = { group = "androidx.annotation",         name = "annotation",                        version.ref = "androidxAnnotation" }
kotlinx-coroutines-core               = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-core",           version.ref = "kotlinxCoroutines" }
kotlinx-collections-immutable         = { group = "org.jetbrains.kotlinx",       name = "kotlinx-collections-immutable",     version.ref = "kotlinxCollections" }
kotlinx-datetime                      = { group = "org.jetbrains.kotlinx",       name = "kotlinx-datetime",                  version.ref = "kotlinxDatetime" }
coil-compose                          = { group = "io.coil-kt.coil3",            name = "coil-compose",                      version.ref = "coil" }
coil-network-okhttp                   = { group = "io.coil-kt.coil3",            name = "coil-network-okhttp",               version.ref = "coil" }
# Test
junit                                 = { group = "junit",                       name = "junit",                             version.ref = "junit" }
kotlin-test                           = { group = "org.jetbrains.kotlin",        name = "kotlin-test",                       version.ref = "kotlin" }
robolectric                           = { group = "org.robolectric",             name = "robolectric",                       version.ref = "robolectric" }
roborazzi                             = { group = "io.github.takahirom.roborazzi", name = "roborazzi",                       version.ref = "roborazzi" }
roborazzi-compose                     = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose",               version.ref = "roborazzi" }
roborazzi-junit-rule                  = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule",            version.ref = "roborazzi" }
konsist                               = { group = "com.lemonappdev",             name = "konsist",                           version.ref = "konsist" }
kotlinx-coroutines-test               = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-test",           version.ref = "kotlinxCoroutines" }
turbine                               = { group = "app.cash.turbine",            name = "turbine",                           version.ref = "turbine" }
errorprone-annotations                = { group = "com.google.errorprone",       name = "error_prone_annotations",           version.ref = "errorProneAnnotations" }
androidx-concurrent-futures           = { group = "androidx.concurrent",         name = "concurrent-futures",                version.ref = "concurrentFutures" }
# Copy-paste-detektor (cpdCheck i rotens build.gradle.kts)
pmd-cli                               = { group = "net.sourceforge.pmd",         name = "pmd-cli",                           version.ref = "pmd" }
pmd-kotlin                            = { group = "net.sourceforge.pmd",         name = "pmd-kotlin",                        version.ref = "pmd" }
compose-rules-ktlint                  = { group = "io.nlopez.compose.rules",     name = "ktlint",                            version.ref = "composeRules" }

[plugins]
android-library      = { id = "com.android.library",                       version.ref = "agp" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
roborazzi            = { id = "io.github.takahirom.roborazzi",             version.ref = "roborazzi" }
spotless             = { id = "com.diffplug.spotless",                     version.ref = "spotless" }
